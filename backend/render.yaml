services:
  - type: web
    name: gaming-bot-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gaming-bot-db
          property: connectionString

databases:
  - name: gaming-bot-db
    databaseName: gaming_bot
    user: gaming_bot_user
